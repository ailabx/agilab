{% extends "base.html" %}
{% block title %}分析 - AGI实验室{% endblock %}
{% block content %}
<h2>标的分析</h2>

<!-- 输入区 -->
<div class="card mb-3">
    <div class="card-header"><i class="bi bi-search"></i> 输入分析目标</div>
    <div class="card-body">
        <form id="analyze-form" class="row g-2 align-items-end">
            <div class="col-auto">
                <label class="form-label">市场</label>
                <select class="form-select" name="market" id="f-market">
                    <option value="stock">个股</option>
                    <option value="etf">ETF</option>
                    <option value="futures">期货</option>
                    <option value="convertible">可转债</option>
                </select>
            </div>
            <div class="col-auto">
                <label class="form-label">品种代码</label>
                <input type="text" class="form-control" name="symbol" id="f-symbol" placeholder="如 600519" required>
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-primary" id="f-submit">
                    <i class="bi bi-play-fill"></i> 开始分析
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 左右布局: 左侧任务列表 + 右侧任务详情 -->
<div class="row">
    <div class="col-3">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span><i class="bi bi-list-task"></i> 任务列表</span>
                <button class="btn btn-sm btn-outline-secondary" onclick="loadTasks()" title="刷新">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
            <div class="list-group list-group-flush" id="task-list">
                <div class="text-center text-muted p-3">加载中...</div>
            </div>
        </div>
    </div>
    <div class="col-9">
        <div id="task-detail" style="max-height:calc(100vh - 280px); overflow-y:auto;">
            <div class="text-center text-muted p-5">选择左侧任务查看详情，或提交新分析</div>
        </div>
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
(function() {
    const form = document.getElementById('analyze-form');
    const submitBtn = document.getElementById('f-submit');
    const taskList = document.getElementById('task-list');
    const taskDetail = document.getElementById('task-detail');

    let activeTaskId = null;
    let pollTimer = null;
    let expandedCards = new Set();  // 记住用户手动展开的 Phase 名

    // ==================== 提交新任务 ====================
    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const market = document.getElementById('f-market').value;
        const symbol = document.getElementById('f-symbol').value.trim();
        if (!symbol) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="bi bi-hourglass-split"></i> 提交中...';

        try {
            const resp = await fetch('/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'market=' + encodeURIComponent(market) + '&symbol=' + encodeURIComponent(symbol),
            });
            const data = await resp.json();
            if (data.task_id) {
                activeTaskId = data.task_id;
                await loadTasks();
                startPolling(data.task_id);
            }
        } catch(err) {
            taskDetail.innerHTML = '<div class="alert alert-danger">提交失败: ' + esc(err.message) + '</div>';
        }
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-play-fill"></i> 开始分析';
    });

    // ==================== 任务列表 ====================
    async function loadTasks() {
        try {
            const r = await fetch('/api/tasks');
            const tasks = await r.json();
            if (!tasks.length) {
                taskList.innerHTML = '<div class="text-center text-muted p-3">暂无任务</div>';
                return;
            }
            taskList.innerHTML = tasks.map(t => {
                const cls = t.status === 'running' ? 'list-group-item-warning' :
                            t.status === 'cancelled' ? 'list-group-item-secondary' :
                            t.status === 'done' ? '' : 'list-group-item-danger';
                const active = t.task_id === activeTaskId ? 'active' : '';
                const icon = t.status === 'running' ? 'hourglass-split' :
                             t.status === 'cancelled' ? 'slash-circle' : 'check-circle';
                const badgeColor = t.status === 'running' ? 'primary' :
                                   t.status === 'cancelled' ? 'secondary' : 'success';
                let actions = '';
                if (t.status === 'running') {
                    actions = `<button class="btn btn-sm btn-outline-warning border-0" onclick="event.stopPropagation();cancelTask('${t.task_id}')" title="取消"><i class="bi bi-stop-circle"></i></button>`;
                }
                actions += `<button class="btn btn-sm btn-outline-danger border-0" onclick="event.stopPropagation();deleteTask('${t.task_id}')" title="删除"><i class="bi bi-trash"></i></button>`;
                return `<div class="list-group-item list-group-item-action ${cls} ${active}" style="cursor:pointer;"
                         onclick="selectTask('${t.task_id}')">
                    <div class="d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-${icon}"></i> ${esc(t.symbol)}</span>
                        <span class="badge bg-${badgeColor}">${t.status}</span>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mt-1">
                        <small class="text-muted">${t.market} · ${t.duration}s</small>
                        <span>${actions}</span>
                    </div>
                </div>`;
            }).join('');

            // 如果有运行中的任务但没选中，自动选中
            const running = tasks.find(t => t.status === 'running');
            if (running && !activeTaskId) {
                activeTaskId = running.task_id;
                startPolling(activeTaskId);
            }
        } catch(e) {
            taskList.innerHTML = '<div class="text-center text-danger p-3">加载失败</div>';
        }
    }

    // 取消任务
    window.cancelTask = async function(taskId) {
        await fetch('/api/tasks/' + taskId + '/cancel', { method: 'POST' });
        await loadTasks();
        if (activeTaskId === taskId) {
            stopPolling();
        }
    };

    // 删除任务
    window.deleteTask = async function(taskId) {
        if (!confirm('确认删除?')) return;
        await fetch('/api/tasks/' + taskId, { method: 'DELETE' });
        if (activeTaskId === taskId) {
            activeTaskId = null;
            stopPolling();
            taskDetail.innerHTML = '<div class="text-center text-muted p-5">选择左侧任务查看详情</div>';
        }
        await loadTasks();
    };

    // 暴露给全局供 onclick 调用
    window.toggleCard = function(headerEl) {
        const body = headerEl.nextElementSibling;
        const name = headerEl.querySelector('span').textContent.trim();
        if (body.style.maxHeight === '0px') {
            body.style.maxHeight = '500px';
            expandedCards.add(name);
        } else {
            body.style.maxHeight = '0px';
            expandedCards.delete(name);
        }
    };

    window.selectTask = async function(taskId) {
        activeTaskId = taskId;
        expandedCards.clear();
        // 高亮选中项
        document.querySelectorAll('#task-list .list-group-item').forEach(el => {
            el.classList.remove('active');
        });
        event.target.closest('.list-group-item').classList.add('active');

        // 渲染详情
        const r = await fetch('/api/analyze/' + taskId);
        const data = await r.json();
        taskDetail.innerHTML = renderResult(data);

        // 如果还在运行，继续轮询
        if (data.status === 'running') {
            startPolling(taskId);
        } else {
            stopPolling();
        }
    };

    // ==================== 轮询 ====================
    function startPolling(taskId) {
        stopPolling();
        pollTimer = setInterval(async () => {
            try {
                const r = await fetch('/api/analyze/' + taskId);
                const data = await r.json();
                if (data.status === 'not_found') {
                    stopPolling();
                    return;
                }
                taskDetail.innerHTML = renderResult(data);
                // 自动滚动到最新结果
                taskDetail.scrollTop = taskDetail.scrollHeight;
                // 更新任务列表中的状态
                await loadTasks();
                if (data.status === 'done') {
                    stopPolling();
                }
            } catch(e) {}
        }, 3000);
    }

    function stopPolling() {
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    }

    // ==================== 渲染 ====================
    function renderResult(data) {
        const symbol = data.symbol || '';
        const phases = data.phases || [];
        const signal = data.signal || {};
        const running = data.status === 'running';

        let html = '<h4>' + esc(symbol) + ' ';
        if (running) {
            html += '<span class="badge bg-primary"><i class="bi bi-hourglass-split"></i> 运行中</span>';
        } else {
            html += '<span class="badge bg-secondary">已完成</span>';
        }
        if (data.duration) html += ' <small class="text-muted">' + data.duration + 's</small>';
        html += '</h4>';

        for (let i = 0; i < phases.length; i++) {
            const p = phases[i];
            const out = p.output || '';
            const truncated = out.length > 2000 ? out.substring(0, 2000) + '...' : out;
            const isDone = p.status === '✓ 通过';
            const isRunning = p.status === '运行中';
            // 运行中→展开；已完成→默认折叠，除非用户手动展开过
            const collapsed = isDone && !expandedCards.has(p.name);
            const bodyStyle = collapsed ? 'max-height:0;overflow:hidden;'
                           : isRunning ? 'max-height:300px;overflow:auto;'
                           : 'max-height:500px;overflow:auto;';
            html += '<div class="card mb-2">'
                + '<div class="card-header d-flex justify-content-between align-items-center" style="cursor:pointer;" '
                + 'onclick="toggleCard(this)">'
                + '<span><i class="bi bi-' + p.icon + '"></i> ' + esc(p.name) + '</span>'
                + '<span class="badge bg-' + p.status_color + '">' + esc(p.status) + '</span>'
                + '</div><div class="card-body" style="' + bodyStyle + 'transition:max-height .2s;">';
            if (truncated) {
                html += '<pre style="max-height:200px;overflow:auto;white-space:pre-wrap;font-size:12px;">' + esc(truncated) + '</pre>';
            } else if (p.status === '运行中') {
                html += '<div class="text-center"><div class="spinner-border spinner-border-sm text-primary"></div> 执行中...</div>';
            } else {
                html += '<p class="text-muted mb-0">无输出</p>';
            }
            html += '</div></div>';
        }

        if (signal.direction) {
            const dir = signal.direction;
            const color = dir === '做多' ? 'success' : dir === '做空' ? 'danger' : 'warning';
            const icon = dir === '做多' ? 'arrow-up-circle' : dir === '做空' ? 'arrow-down-circle' : 'dash-circle';
            const riskColor = signal.risk === 'green' ? 'success' : signal.risk === 'yellow' ? 'warning' : 'danger';
            html += '<div class="card border-' + color + '">'
                + '<div class="card-header bg-' + color + ' text-white">'
                + '<i class="bi bi-' + icon + '"></i> 交易信号: ' + esc(dir) + '</div>'
                + '<div class="card-body"><table class="table table-sm mb-0">'
                + '<tr><td>方向</td><td><strong>' + esc(dir) + '</strong></td><td>置信度</td><td>' + (signal.confidence || 0) + '</td></tr>'
                + '<tr><td>入场价</td><td>' + (signal.entry || '-') + '</td><td>止损价</td><td>' + (signal.stop_loss || '-') + '</td></tr>'
                + '<tr><td>目标价</td><td>' + (signal.target || '-') + '</td><td>仓位</td><td>' + (signal.position_pct || '-') + '%</td></tr>'
                + '<tr><td>风控</td><td><span class="badge bg-' + riskColor + '">' + esc(signal.risk || '-') + '</span></td><td>耗时</td><td>' + (data.duration || 0) + 's</td></tr>'
                + '</table></div></div>';
        }

        return html;
    }

    function esc(s) {
        if (!s) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ==================== 页面加载时恢复 ====================
    loadTasks();
})();
</script>
{% endblock %}
