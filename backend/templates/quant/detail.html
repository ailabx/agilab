{% extends "base.html" %}
{% block title %}{{ symbol }} - 量化看板{% endblock %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="m-0" id="symbol-title">{{ symbol }}</h2>
        <div class="text-muted mt-1"><span id="stock-name">-</span> · <span id="stock-industry">-</span> · <span id="stock-area">-</span></div>
    </div>
    <a href="/quant" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left"></i> 返回看板</a>
</div>

<div class="row g-4 mb-4">
    <div class="col-md-3">
        <div class="stat-card">
            <div class="icon" style="background: linear-gradient(135deg, #dbeafe, #bfdbfe); color: #1e40af;"><i class="bi bi-currency-yen"></i></div>
            <div class="num" id="latest-close">-</div>
            <div class="label">最新收盘价</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card">
            <div class="icon" style="background: linear-gradient(135deg, #dcfce7, #bbf7d0); color: #166534;"><i class="bi bi-calendar"></i></div>
            <div class="num" id="latest-date">-</div>
            <div class="label">最新日期</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card">
            <div class="icon" style="background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e;"><i class="bi bi-graph-up"></i></div>
            <div class="num" id="day-pct">-</div>
            <div class="label">日涨跌幅</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="stat-card">
            <div class="icon" style="background: linear-gradient(135deg, #fce7f3, #fbcfe8); color: #9d174d;"><i class="bi bi-lightning"></i></div>
            <div class="num" id="momentum-20">-</div>
            <div class="label">20日动量</div>
        </div>
    </div>
</div>

<div class="card mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="bi bi-graph-line"></i> 收盘价走势</span>
        <div class="d-flex gap-2 align-items-center">
            <div class="btn-group btn-group-sm" role="group">
                <button type="button" class="btn btn-outline-primary active" id="adj-qfq" onclick="setAdjusted('qfq')">前复权</button>
                <button type="button" class="btn btn-outline-primary" id="adj-hfq" onclick="setAdjusted('hfq')">后复权</button>
                <button type="button" class="btn btn-outline-primary" id="adj-raw" onclick="setAdjusted('raw')">不复权</button>
            </div>
            <div class="btn-group btn-group-sm" role="group">
                <button type="button" class="btn btn-outline-primary" id="range-1m" onclick="setRange(22, '1m')">近1月</button>
                <button type="button" class="btn btn-outline-primary" id="range-6m" onclick="setRange(120, '6m')">近6月</button>
                <button type="button" class="btn btn-outline-primary active" id="range-1y" onclick="setRange(250, '1y')">近1年</button>
                <button type="button" class="btn btn-outline-primary" id="range-all" onclick="setRange(null, 'all')">全部</button>
            </div>
        </div>
    </div>
    <div class="card-body"><canvas id="priceChart" height="120"></canvas></div>
</div>

<div class="card">
    <div class="card-header"><i class="bi bi-bar-chart"></i> 成交量</div>
    <div class="card-body"><canvas id="volumeChart" height="80"></canvas></div>
</div>

<div class="card mt-4">
    <div class="card-header"><i class="bi bi-file-earmark-text"></i> 核心财务指标</div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-sm table-hover mb-0" id="fina-table">
                <thead class="table-light">
                    <tr id="fina-head">
                        <th>报告期</th>
                    </tr>
                </thead>
                <tbody id="fina-body"></tbody>
            </table>
        </div>
        <div id="fina-empty" class="p-3 text-muted small" style="display:none">暂无财务指标数据</div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const symbol = "{{ symbol }}";
let allData = null;
let priceChart = null;
let volumeChart = null;
let currentDays = 250;
let currentAdjusted = 'qfq';

function formatPct(v) {
    if (v === null || v === undefined) return '-';
    const sign = v > 0 ? '+' : '';
    return `${sign}${(v * 100).toFixed(2)}%`;
}

function sliceData(days) {
    if (!allData) return null;
    const dates = allData.all_dates || allData.dates;
    const closes = allData.all_closes || allData.closes;
    const volumes = allData.all_volumes || allData.volumes;
    if (!days || days >= dates.length) {
        return { dates, closes, volumes };
    }
    return {
        dates: dates.slice(-days),
        closes: closes.slice(-days),
        volumes: volumes.slice(-days)
    };
}

function renderCharts(days) {
    const data = sliceData(days);
    if (!data) return;

    if (priceChart) {
        priceChart.data.labels = data.dates;
        priceChart.data.datasets[0].data = data.closes;
        priceChart.update();
    }
    if (volumeChart) {
        volumeChart.data.labels = data.dates;
        volumeChart.data.datasets[0].data = data.volumes;
        volumeChart.update();
    }
}

function setRange(days, label) {
    currentDays = days;
    document.querySelectorAll('[id^="range-"]').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`range-${label}`).classList.add('active');
    renderCharts(days);
}

function setAdjusted(adjusted) {
    currentAdjusted = adjusted;
    document.querySelectorAll('[id^="adj-"]').forEach(btn => btn.classList.remove('active'));
    document.getElementById(`adj-${adjusted}`).classList.add('active');
    loadDetail();
}

async function loadDetail() {
    const res = await fetch(`/api/stock/${symbol}?adjusted=${currentAdjusted}`);
    const data = await res.json();

    if (data.error) {
        document.querySelector('.main').innerHTML = `<div class="alert alert-warning">${data.error}</div>`;
        return;
    }

    allData = data;

    document.getElementById('symbol-title').textContent = data.symbol;
    document.getElementById('stock-name').textContent = data.name || '-';
    document.getElementById('stock-industry').textContent = data.industry || '-';
    document.getElementById('stock-area').textContent = data.area || '-';
    document.getElementById('latest-close').textContent = data.latest_close.toFixed(2);
    document.getElementById('latest-date').textContent = data.latest_date;

    const dayPct = data.day_pct;
    const dayEl = document.getElementById('day-pct');
    dayEl.textContent = dayPct !== null ? formatPct(dayPct) : '-';
    dayEl.className = 'num ' + (dayPct >= 0 ? 'text-danger' : 'text-success');

    const mom = data.momentum_20;
    const momEl = document.getElementById('momentum-20');
    momEl.textContent = mom !== null ? formatPct(mom) : '-';
    momEl.className = 'num ' + (mom >= 0 ? 'text-danger' : 'text-success');

    const chartData = sliceData(currentDays);
    const labels = chartData.dates;

    if (priceChart) { priceChart.destroy(); }
    if (volumeChart) { volumeChart.destroy(); }

    priceChart = new Chart(document.getElementById('priceChart'), {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '收盘价',
                data: chartData.closes,
                borderColor: '#6366f1',
                backgroundColor: 'rgba(99, 102, 241, 0.1)',
                fill: true,
                pointRadius: 0,
                tension: 0.2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: { display: false },
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            return context[0].label;
                        },
                        label: function(context) {
                            return '收盘价: ' + context.parsed.y.toFixed(2);
                        }
                    }
                },
                zoom: { zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }, pan: { enabled: true, mode: 'x' } }
            },
            scales: {
                x: { ticks: { maxTicksLimit: 8 } },
                y: {}
            }
        }
    });

    volumeChart = new Chart(document.getElementById('volumeChart'), {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: '成交量',
                data: chartData.volumes,
                backgroundColor: 'rgba(99, 102, 241, 0.6)'
            }]
        },
        options: {
            responsive: true,
            plugins: {
                title: { display: false },
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        title: function(context) {
                            return context[0].label;
                        },
                        label: function(context) {
                            return '成交量: ' + context.parsed.y.toLocaleString();
                        }
                    }
                }
            },
            scales: { x: { ticks: { maxTicksLimit: 8 } }, y: {} }
        }
    });

    renderFina(data.fina || []);
}

function renderFina(rows) {
    const body = document.getElementById('fina-body');
    const head = document.getElementById('fina-head');
    if (!rows || rows.length === 0) {
        document.getElementById('fina-empty').style.display = 'block';
        return;
    }

    const colConfig = [
        { key: 'end_date', label: '报告期' },
        { key: 'eps', label: 'EPS' },
        { key: 'roe', label: 'ROE(%)' },
        { key: 'roa', label: 'ROA(%)' },
        { key: 'grossprofit_margin', label: '毛利率(%)' },
        { key: 'netprofit_margin', label: '净利率(%)' },
        { key: 'op_yoy', label: '营收同比(%)' },
        { key: 'netprofit_yoy', label: '净利同比(%)' },
        { key: 'bps', label: 'BPS' },
        { key: 'current_ratio', label: '流动比率' }
    ];

    head.innerHTML = colConfig.map(c => `<th>${c.label}</th>`).join('');

    rows.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = colConfig.map(c => {
            let v = row[c.key];
            if (v === null || v === undefined) return '<td>-</td>';
            if (['roe', 'roa', 'grossprofit_margin', 'netprofit_margin', 'op_yoy', 'netprofit_yoy'].includes(c.key)) {
                v = (v * 100).toFixed(2);
            } else if (typeof v === 'number') {
                v = v.toFixed(2);
            }
            return `<td>${v}</td>`;
        }).join('');
        body.appendChild(tr);
    });
}

loadDetail();
</script>
{% endblock %}
