{% extends "base.html" %}
{% block title %}Agent 角色 - AGI实验室{% endblock %}
{% block content %}
<h2>Agent 角色</h2>
<div class="row g-3">
    {% for a in agents %}
    <div class="col-md-4">
        <div class="card agent-card">
            <div class="card-header"><i class="{{ a.icon }}"></i> {{ a.name }}</div>
            <div class="card-body"><p class="mb-0">{{ a.desc }}</p></div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
