<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AGI实验室{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root { --sidebar-w: 220px; --brand: #0d6efd; }
        * { font-size: 14px; }
        body { margin: 0; background: #f8f9fa; }
        .sidebar {
            position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-w);
            background: #1e293b; color: #cbd5e1; z-index: 100;
            display: flex; flex-direction: column;
        }
        .sidebar .brand {
            padding: 16px 20px; font-size: 18px; font-weight: 600; color: #fff;
            border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 8px;
        }
        .sidebar .brand i { font-size: 20px; color: var(--brand); }
        .nav-btn {
            color: #94a3b8; padding: 10px 20px; cursor: pointer; border: none;
            background: none; text-align: left; width: 100%; transition: all .15s;
            display: flex; align-items: center; text-decoration: none;
        }
        .nav-btn:hover { background: #334155; color: #fff; }
        .nav-btn.active { background: var(--brand); color: #fff; }
        .nav-btn i { margin-right: 8px; }
        .nav-btn .ver { margin-left: auto; font-size: 11px; color: #475569; }
        .sidebar-bottom { margin-top: auto; border-top: 1px solid #334155; }
        .main { margin-left: var(--sidebar-w); padding: 24px; }
        .main h2 { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
        .card-header { background: #fff; border-bottom: 1px solid #e2e8f0; font-weight: 600; padding: 12px 16px; }
        .stat { text-align: center; }
        .stat .num { font-size: 28px; font-weight: 700; color: var(--brand); }
        .stat .label { font-size: 12px; color: #64748b; }
        .file-tree { font-family: monospace; font-size: 13px; }
        .file-tree .dir { color: var(--brand); font-weight: 600; }
        .file-tree .file { color: #475569; }
        pre { background: #f1f5f9; padding: 12px; border-radius: 6px; font-size: 13px; }
        .config-path { font-family: monospace; font-size: 12px; color: #64748b; }
        .step-badge { padding: 6px 12px; margin: 4px; }
        .agent-card .card-header { display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

<!-- 左侧导航 -->
<div class="sidebar">
    <div class="brand"><i class="bi bi-graph-up-arrow"></i> AGI实验室</div>
    <a class="nav-btn {{ 'active' if active_page == 'overview' }}" href="/"><i class="bi bi-house-door"></i> 概览</a>
    <a class="nav-btn {{ 'active' if active_page == 'analyze' }}" href="/analyze"><i class="bi bi-graph-up"></i> 标的分析</a>
    <a class="nav-btn {{ 'active' if active_page == 'workflow' }}" href="/workflow"><i class="bi bi-diagram-3"></i> 工作流</a>
    <a class="nav-btn {{ 'active' if active_page == 'agents' }}" href="/agents"><i class="bi bi-people"></i> Agent 角色</a>
    <a class="nav-btn {{ 'active' if active_page == 'files' }}" href="/files"><i class="bi bi-folder2-open"></i> 项目文件</a>
    <a class="nav-btn {{ 'active' if active_page == 'cache' }}" href="/cache"><i class="bi bi-database"></i> 数据缓存</a>
    <div class="sidebar-bottom">
        <a class="nav-btn" href="/settings"><i class="bi bi-gear"></i> 设置 <span class="ver">v0.1</span></a>
    </div>
</div>

<!-- 右侧主区域 -->
<div class="main">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
