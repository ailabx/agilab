{% extends "base.html" %}
{% block title %}项目文件 - AGI实验室{% endblock %}
{% block content %}
<h2>项目文件</h2>
<div class="card">
    <div class="card-header">agents/ 目录结构</div>
    <div class="card-body file-tree">
        {% for f in file_tree %}
        <div class="{{ f.type }}" style="padding-left: {{ f.indent }}px;">{{ f.text }}</div>
        {% endfor %}
    </div>
</div>
{% endblock %}
